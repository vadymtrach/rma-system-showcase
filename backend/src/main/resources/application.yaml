server:
  port: ${SPRING_PORT:8080}
  forward-headers-strategy: framework
  servlet:
    session:
      timeout: 60m
      cookie:
        http-only: true
        secure: ${COOKIE_SECURE:true}
        same-site: strict

app:
  # Comma-separated origins allowed for CORS and the /ws WebSocket endpoint.
  allowed-origins: ${ALLOWED_ORIGINS:https://localhost,http://localhost,http://localhost:3000,http://localhost:8080}

spring:
  application:
    name: rma-system

  web:
    error:
      whitelabel:
        enabled: false
      include-stacktrace: never
      include-message: never
      include-binding-errors: never

  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${POSTGRES_DB:rma_db}
    username: ${POSTGRES_USER:postgres}
    password: ${POSTGRES_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true